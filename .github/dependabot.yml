version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    open-pull-requests-limit: 3
    schedule:
      interval: monthly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 2
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
