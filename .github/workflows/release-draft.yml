name: Prepare macOS release draft

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing signed tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: public-release-draft
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 50
    environment: public-release
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    env:
      CODEXDESK_UPDATE_ARCH: arm64
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Validate release tag and configure public URLs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$version"
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object | select(.type == "tag") | .sha')"
          test -n "$tag_object"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" --jq '.verification.verified')" = "true"
          feed_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/feed.json"
          asset_base_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/"
          echo "CODEXDESK_UPDATE_FEED_URL=$feed_url" >> "$GITHUB_ENV"
          echo "CODEXDESK_UPDATE_ASSET_BASE_URL=$asset_base_url" >> "$GITHUB_ENV"
          echo "CODEXDESK_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run release:verify

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          test -n "$MACOS_CERTIFICATE_P12_BASE64"
          test -n "$MACOS_CERTIFICATE_PASSWORD"
          keychain_path="$RUNNER_TEMP/codexdesk-public-release.keychain-db"
          keychain_password="$(openssl rand -base64 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$RUNNER_TEMP/codexdesk-release.p12"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/codexdesk-release.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          echo "CODEXDESK_BUILD_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Build signed public candidate
        env:
          CODEXDESK_MAC_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          test -n "$CODEXDESK_MAC_SIGN_IDENTITY"
          npm run make:public-release

      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          CODEXDESK_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          CODEXDESK_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          test -n "$APPLE_API_KEY_P8_BASE64"
          test -n "$CODEXDESK_NOTARY_KEY_ID"
          test -n "$CODEXDESK_NOTARY_ISSUER"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 -D > "$RUNNER_TEMP/codexdesk-notary.p8"
          chmod 600 "$RUNNER_TEMP/codexdesk-notary.p8"
          echo "CODEXDESK_NOTARY_KEY_PATH=$RUNNER_TEMP/codexdesk-notary.p8" >> "$GITHUB_ENV"
          echo "CODEXDESK_NOTARY_KEY_ID=$CODEXDESK_NOTARY_KEY_ID" >> "$GITHUB_ENV"
          echo "CODEXDESK_NOTARY_ISSUER=$CODEXDESK_NOTARY_ISSUER" >> "$GITHUB_ENV"

      - name: Notarize, inspect, and prepare release metadata
        env:
          CODEXDESK_PUBLIC_RELEASE: "true"
          CODEXDESK_MAC_SIGN_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          npm run notarize:release
          npm run release:inspect
          npm run release:sbom
          npm run update:prepare-release

      - name: Retain private review artifact
        uses: actions/upload-artifact@v6
        with:
          name: CodexDesk-macOS-arm64-${{ inputs.release_tag }}
          path: |
            app/out/make/zip/darwin/arm64/CodexDesk-macOS-arm64-*.zip
            app/out/make/dmg/darwin/arm64/CodexDesk-macOS-arm64-*.dmg
            app/out/make/zip/darwin/arm64/SHA256SUMS.txt
            app/out/make/zip/darwin/arm64/feed.json
            app/out/release/CodexDesk-*-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: |
          if [ -n "${CODEXDESK_BUILD_KEYCHAIN:-}" ]; then
            security delete-keychain "$CODEXDESK_BUILD_KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/codexdesk-release.p12" "$RUNNER_TEMP/codexdesk-notary.p8"

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/download-artifact@v7
        with:
          name: CodexDesk-macOS-arm64-${{ inputs.release_tag }}
          path: release-artifacts

      - name: Create an unpublished prerelease draft
        run: |
          version="${RELEASE_TAG#v}"
          test -f "RELEASE_NOTES.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          mapfile -t assets < <(find release-artifacts -type f -print | sort)
          test "${#assets[@]}" -eq 5
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "CodexDesk $version" \
            --notes-file "RELEASE_NOTES.md" \
            "${assets[@]}"
